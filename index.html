<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Photo Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fffaf4;
            --text-dark: #2c2c2c;
            --paper-color: #fdfbf7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(#d5c3b3 1px, transparent 1px);
            background-size: 20px 20px;
        }

        header {
            padding: 30px 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* -----------------------------------
           The Horizontal Scrolling Track
           ----------------------------------- */
        .timeline-track {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 150px; /* Increased gap to account for wider photo scatter */
            padding: 0 10vw;
            
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none; 
        }
        
        .timeline-track::-webkit-scrollbar { display: none; }

        /* -----------------------------------
           Album Cluster Styling
           ----------------------------------- */
        .album-cluster {
            flex-shrink: 0;
            margin-bottom: 100px;
            scroll-snap-align: center;
            position: relative;
            width: 380px; /* Widened to fit the scattered images */
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Image Stack Styling */
        .photo {
            position: absolute;
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(0,0,0,0.05);
            border-radius: 2px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s;
            cursor: pointer; /* Indicates it can be clicked */
        }

        .photo img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            background-color: #ccc;
            display: block;
        }

        /* WIDER scattered stack effect */
        .photo:nth-child(1) {
            transform: rotate(-10deg) translate(-60px, -20px);
            z-index: 1;
        }
        .photo:nth-child(2) {
            transform: rotate(8deg) translate(50px, 10px);
            z-index: 2;
        }
        .photo:nth-child(3) {
            transform: rotate(-4deg) translate(-10px, 60px);
            z-index: 3;
        }

        /* Expand even further on hover so background images are easier to click */
        .album-cluster:hover .photo:nth-child(1) { transform: rotate(-12deg) translate(-90px, -30px); }
        .album-cluster:hover .photo:nth-child(2) { transform: rotate(10deg) translate(80px, 15px); }
        .album-cluster:hover .photo:nth-child(3) { transform: rotate(-5deg) translate(-20px, 90px); }

        /* Add a little pop effect when hovering individual photos */
        .photo:hover {
            box-shadow: 0 25px 50px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        /* Embedded Text Card */
        .text-card {
            position: absolute;
            bottom: -20px;
            right: -60px;
            background: var(--paper-color);
            padding: 15px 20px;
            width: 240px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            z-index: 1000; /* Extremely high so photos never cover the text */
            transform: rotate(-3deg);
            border-left: 3px solid #d35400;
            pointer-events: none; /* Lets clicks pass through to photos underneath */
        }

        .text-card p {
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            line-height: 1.3;
            color: #333;
        }

        .text-date {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* -----------------------------------
           Standalone Doodle/Note
           ----------------------------------- */
        .doodle-note {
            flex-shrink: 0;
            scroll-snap-align: center;
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: #444;
            transform: rotate(2deg);
            max-width: 300px;
            text-align: center;
            line-height: 1.2;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .album-cluster {
                width: 500px; /* Widened for desktop scatter */
                height: 500px;
            }
            .photo img {
                width: 350px;
                height: 350px;
            }
            
            /* Wider scatter for larger screens */
            .photo:nth-child(1) { transform: rotate(-10deg) translate(-80px, -30px); }
            .photo:nth-child(2) { transform: rotate(8deg) translate(70px, 10px); }
            .photo:nth-child(3) { transform: rotate(-4deg) translate(-20px, 80px); }

            .album-cluster:hover .photo:nth-child(1) { transform: rotate(-12deg) translate(-110px, -40px); }
            .album-cluster:hover .photo:nth-child(2) { transform: rotate(10deg) translate(100px, 15px); }
            .album-cluster:hover .photo:nth-child(3) { transform: rotate(-5deg) translate(-30px, 120px); }

            .text-card {
                width: 280px;
                bottom: -20px;
                right: -60px;
                padding: 20px 25px;
            }
            .text-card p {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <main class="timeline-track" id="track"></main>

        const track = document.getElementById('track');
        let globalZIndexCounter = 50; // Keeps track of the highest z-index across all photos

        albumData.forEach(item => {
            const wrapper = document.createElement('div');

            if (item.type === 'album') {
                wrapper.className = 'album-cluster';
                
                let photosHTML = item.images.map(imgUrl => `
                    <div class="photo">
                        <img src="${imgUrl}" alt="Memory">
                    </div>
                `).join('');

                wrapper.innerHTML = `
                    ${photosHTML}
                    <div class="text-card">
                        <div class="text-date">${item.date}</div>
                        <p>${item.text}</p>
                    </div>
                `;

                // Add click listener to each photo to bring it to the front
                const photos = wrapper.querySelectorAll('.photo');
                photos.forEach(photo => {
                    photo.addEventListener('click', function() {
                        globalZIndexCounter++;
                        this.style.zIndex = globalZIndexCounter;
                    });
                });

            } else if (item.type === 'note') {
                wrapper.className = 'doodle-note';
                wrapper.innerHTML = item.text;
            }

            track.appendChild(wrapper);
        });

        track.addEventListener('wheel', (evt) => {
            if (evt.deltaY !== 0 && evt.deltaX === 0) {
                evt.preventDefault();
                track.scrollBy({
                    left: evt.deltaY > 0 ? 300 : -300, 
                    behavior: 'smooth'
                });
            }
        }, { passive: false });
